<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青禾报销助手 · 本机项目</title>
<style>body{margin:0;background:#f1f5fa;color:#15263b;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}main{max-width:850px;margin:auto;padding:30px 20px}h1{font-size:30px}section{background:#fff;padding:22px;border:1px solid #dce3ee;border-radius:12px;margin:18px 0}textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;min-height:90px}button{background:#1766dc;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#122135;color:#d7ecff;padding:16px;border-radius:7px;font:14px/1.8 Consolas,monospace}p{color:#56667a}#answer{white-space:pre-wrap}label{display:block;margin-bottom:8px}</style>
<main><p>本机实践项目 · 虚构企业与制度</p><h1>青禾报销助手</h1><p id="stage">问题送到后端 → 筛选有效且可见的资料 → 调用模型 → 返回答案与来源。身份由服务端 DEMO_USER 模拟配置；该页面没有真实员工登录。</p>
<section><form id="form"><label for="question">你想了解什么？</label><textarea id="question" maxlength="500">报销需要哪些材料？</textarea><button id="send">发送问题</button></form></section>
<section aria-live="polite"><b id="status">等待发送</b><p id="answer">发送后可以看到后端响应。</p><div id="sources"></div></section>
<section><b>刚才发出的请求</b><pre id="request">尚未发送</pre><b>后端返回的 JSON</b><pre id="response">尚未返回</pre></section>
<script>
const route='/ask-policy';
if(route==='/inspect')document.querySelector('#stage').textContent='第一阶段只观察 HTTP / API / JSON：接收问题并返回回执，没有查资料或调用模型。';
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const send=document.querySelector('#send');const body={question:document.querySelector('#question').value};send.disabled=true;document.querySelector('#request').textContent='POST '+route+'\nContent-Type: application/json\n\n'+JSON.stringify(body,null,2);document.querySelector('#status').textContent='后端处理中…';document.querySelector('#sources').replaceChildren();document.querySelector('#answer').textContent='等待响应…';try{const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();document.querySelector('#status').textContent='HTTP '+response.status;document.querySelector('#response').textContent=JSON.stringify(result,null,2);document.querySelector('#answer').textContent=result.answer||(result.received?'已接到问题：'+result.received+'。下一阶段接入资料查询。':result.error||JSON.stringify(result.detail));for(const source of result.sources||[]){const p=document.createElement('p');p.textContent='['+source.id+'] '+source.title+'：'+source.text;document.querySelector('#sources').append(p);}}catch{document.querySelector('#status').textContent='请求失败';document.querySelector('#answer').textContent='请确认本机服务仍在运行。';document.querySelector('#response').textContent='没有收到有效 JSON 响应';}finally{send.disabled=false;}});
</script></main></html>
