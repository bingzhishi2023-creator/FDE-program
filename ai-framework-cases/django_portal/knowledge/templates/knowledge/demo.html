<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Django 知识助手案例</title>
<style>body{font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#142237;background:#f3f6fa}h1{font-size:28px}input,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #ccd6e4}input{width:100%;box-sizing:border-box}button{margin-top:14px;background:#1766dc;color:#fff}pre{background:#fff;border:1px solid #dbe2ec;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px}a{color:#1766dc}</style></head><body>
<h1>Django 知识助手案例</h1><p>从数据库读取最多 5 份有效资料，调用本机模型回答。这个案例没有向量检索；请核对返回原文。</p><p><a href="/admin/knowledge/document/">管理知识文档</a></p>
<form id="ask-form">{% csrf_token %}<label for="question">问题</label><input id="question" name="question" required maxlength="500" placeholder="差旅报销需要哪些材料？"><button id="send">发送给本机模型</button></form>
<pre id="result" aria-live="polite">登录后先在 Admin 添加有效文档，再发送问题。</pre>
<script>document.querySelector('#ask-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#send'),output=document.querySelector('#result');button.disabled=true;output.textContent='等待本机模型…';try{const response=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify({question:document.querySelector('#question').value})});output.textContent='HTTP '+response.status+'\n'+JSON.stringify(await response.json(),null,2)}catch{output.textContent='请求失败，请检查服务与登录状态。'}finally{button.disabled=false}});</script></body></html>
